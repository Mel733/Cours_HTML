<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Renard avec des div</title>
  <link rel="stylesheet" href="asset/app.css">
</head>
<body>

  <!-- Le parent : il contient tout le renard -->
  <div id="renard">

    <!-- La queue (derrière le corps) -->
    <div class="queue-noir"></div>
    <div class="queue-blanc"></div>
    <div class="bout-queue"></div>

    <!-- Le corps -->
    <div class="corps-noir"></div>
    <div class="corps-blanc"></div>

    <!-- La patte -->
    <div class="patte"></div>

    <!-- Les oreilles -->
    <div class="oreille oreille-gauche"></div>
    <div class="oreille oreille-droite"></div>

    <!-- La tête -->
    <div class="tete-noir"></div>
    <div class="tete-blanc"></div>

    <!-- Les yeux et le nez -->
    <div class="oeil oeil-gauche"></div>
    <div class="oeil oeil-droit"></div>
    <div class="nez"></div>

    <!-- Les petits triangles qui flottent -->
    <div class="petit p1"></div>
    <div class="petit p2"></div>
    <div class="petit p3"></div>
    <div class="petit p4"></div>
    <div class="petit p5"></div>

  </div>

</body>
</html>
