<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Renard</title>
  <link rel="stylesheet" href="asset/app.css">
</head>
<body>
  <!-- La boîte qui contient tout le dessin -->
  <div id="dessin">

    <!-- Les formes noires (oreilles, nez, pied, bout de la queue) -->
    <div id="oreille-gauche"></div>
    <div id="oreille-droite"></div>
    <div id="nez"></div>
    <div id="pied"></div>
    <div id="bout-queue"></div>

    <!-- Les 6 petits triangles qui flottent -->
    <div id="p1"></div>
    <div id="p2"></div>
    <div id="p3"></div>
    <div id="p4"></div>
    <div id="p5"></div>
    <div id="p6"></div>

    <!-- Les yeux fermés -->
    <div class="oeil" id="oeil-gauche"></div>
    <div class="oeil" id="oeil-droit"></div>



  <!-- OREILLES -->
  <div class="trait oreille t1"></div>
  <div class="trait oreille t2"></div>

  <!-- FRONT -->
  <div class="trait front t3"></div>
  <div class="trait front t4"></div>
  <div class="trait front t5"></div>
  <div class="trait front t6"></div>
  <div class="trait front t7"></div>
  <div class="trait front t8"></div>
  <div class="trait front t9"></div>

  <!-- TÊTE : CÔTÉ GAUCHE -->
  <div class="trait tete-gauche t10"></div>
  <div class="trait tete-gauche t11"></div>
  <div class="trait tete-gauche t12"></div>
  <div class="trait tete-gauche t13"></div>
  <div class="trait tete-gauche t14"></div>
  <div class="trait tete-gauche t15"></div>
  <div class="trait tete-gauche t16"></div>

  <!-- TÊTE : CÔTÉ DROIT -->
  <div class="trait tete-droite t17"></div>
  <div class="trait tete-droite t18"></div>
  <div class="trait tete-droite t19"></div>
  <div class="trait tete-droite t20"></div>
  <div class="trait tete-droite t21"></div>
  <div class="trait tete-droite t22"></div>
  <div class="trait tete-droite t23"></div>
  <div class="trait tete-droite t24"></div>

  <!-- CORPS : GAUCHE -->
  <div class="trait corps-gauche t25"></div>
  <div class="trait corps-gauche t26"></div>
  <div class="trait corps-gauche t27"></div>
  <div class="trait corps-gauche t28"></div>
  <div class="trait corps-gauche t29"></div>

  <!-- CORPS : MILIEU -->
  <div class="trait corps-milieu t30"></div>

  <!-- CORPS : DROITE -->
  <div class="trait corps-droite t31"></div>
  <div class="trait corps-droite t32"></div>
  <div class="trait corps-droite t33"></div>
  <div class="trait corps-droite t34"></div>
  <div class="trait corps-droite t35"></div>

  <!-- DOS -->
  <div class="trait dos t36"></div>
  <div class="trait dos t37"></div>
  <div class="trait dos t38"></div>

  <!-- QUEUE -->
  <div class="trait queue t39"></div>
  <div class="trait queue t40"></div>
  <div class="trait queue t41"></div>
  <div class="trait queue t42"></div>

  <!-- SOL -->
  <div class="trait sol t43"></div>
  <div class="trait sol t44"></div>
  <div class="trait sol t45"></div>
  <div class="trait sol t46"></div>

</body>
</html>
